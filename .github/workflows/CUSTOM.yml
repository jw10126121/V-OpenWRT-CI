#CI项目 - 自定义批量编译
name: CUSTOM
run-name: CUSTOM-${{ github.event_name == 'schedule' && 'scheduled' || inputs.UPLOAD_TYPE }}

#CI计划
on:
  schedule:
    - cron: '0 0 15 * *'  # 每月15日 UTC 00:00 运行
  workflow_dispatch:
    inputs:
      WHAT_MY_SAY:
        description: '编译说明'
        required: false
        type: string
        default: ''
      PACKAGE_MANAGER:
        description: '包管理器类型'
        required: true
        default: 'apk'
        type: choice
        options:
          - ipk
          - apk
      UPLOAD_TYPE:
        description: '固件上传方式'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - artifact
      FIREWALL:
        description: '防火墙版本'
        required: true
        default: 'fw4'
        type: choice
        options:
          - fw3
          - fw4

#CI权限
permissions: write-all

#CI任务
jobs:
  # GL-MT6000-WIFI (MTK Filogic 830) - 使用 owrt 分支
  gl_mt6000_wifi:
    name: GL-MT6000-WIFI-${{ inputs.FIREWALL || 'fw4' }}
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      WRT_CONFIG: GL-MT6000-WIFI
      WRT_THEME: argon
      WRT_NAME: Linjw
      WRT_SSID: LEDE
      WRT_WORD: none
      WRT_IP: 192.168.0.1
      WRT_PW: ' '
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: owrt
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_PACKAGE: ''
      WRT_TEST: 'false'
      WRTPackageManager: ${{ inputs.PACKAGE_MANAGER || 'apk' }}
      UPLOAD_TYPE: ${{ inputs.UPLOAD_TYPE || 'release' }}
      WRT_FIREWALL: ${{ inputs.FIREWALL || 'fw4' }}

  # JD-AX6600-WIFI (Qualcomm IPQ60xx) - 使用 main 分支
  jd_ax6600_wifi:
    name: JD-AX6600-WIFI-${{ inputs.FIREWALL || 'fw4' }}
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      WRT_CONFIG: JD-AX6600-WIFI
      WRT_THEME: argon
      WRT_NAME: Linjw
      WRT_SSID: LEDE
      WRT_WORD: none
      WRT_IP: 192.168.0.1
      WRT_PW: ' '
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: main
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_PACKAGE: ''
      WRT_TEST: 'false'
      WRTPackageManager: ${{ inputs.PACKAGE_MANAGER || 'apk' }}
      UPLOAD_TYPE: ${{ inputs.UPLOAD_TYPE || 'release' }}
      WRT_FIREWALL: ${{ inputs.FIREWALL || 'fw4' }}

  # CMIOT-AX18-NOWIFI (Qualcomm IPQ60xx, 无WIFI) - 使用 main 分支
  cmiot_ax18_nowifi:
    name: CMIOT-AX18-NOWIFI-${{ inputs.FIREWALL || 'fw4' }}
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      WRT_CONFIG: CMIOT-AX18-NOWIFI
      WRT_THEME: argon
      WRT_NAME: Linjw
      WRT_SSID: LEDE
      WRT_WORD: none
      WRT_IP: 192.168.0.1
      WRT_PW: ' '
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: main
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_PACKAGE: ''
      WRT_TEST: 'false'
      WRTPackageManager: ${{ inputs.PACKAGE_MANAGER || 'apk' }}
      UPLOAD_TYPE: ${{ inputs.UPLOAD_TYPE || 'release' }}
      WRT_FIREWALL: ${{ inputs.FIREWALL || 'fw4' }}
