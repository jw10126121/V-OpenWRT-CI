#CI项目
name: JD-AX6600

#CI计划
on:
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean
      PACKAGE_MANAGER:
        description: '包管理器类型'
        required: true
        default: 'apk'
        type: choice
        options:
          - ipk
          - apk
      UPLOAD_TYPE:
        description: '固件上传方式'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - artifact

#CI权限
permissions: write-all

#CI任务
jobs:
  config:
    name: JD-AX6600-WIFI
    strategy:
      fail-fast: false

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    secrets: inherit
    with:
      #编译配置
      WRT_CONFIG: JD-AX6600-WIFI
      #默认主题
      WRT_THEME: aurora
      #默认主机名
      WRT_NAME: Linjw
      #默认WIFI名称
      WRT_SSID: LEDE
      #默认WIFI密码（为空则无密码）
      WRT_WORD: none
      #默认地址
      WRT_IP: 192.168.10.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      #源码分支
      WRT_BRANCH: main
      #源码名称
      WRT_SOURCE: VIKINGYFY/immortalwrt
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST}}
      #包管理器类型
      WRTPackageManager: ${{inputs.PACKAGE_MANAGER}}
      #钉钉机器人Token
      DINGDING_TOKEN: ${{secrets.DINGDING_TOKEN}}
      #固件上传方式
      UPLOAD_TYPE: ${{inputs.UPLOAD_TYPE}}
