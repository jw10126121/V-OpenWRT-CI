#云编译公用核心
name: MAIN-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: string
      WRTPackageManager:
        description: '包管理器类型：ipk 或 apk'
        required: false
        type: string
        default: 'ipk'
      UPLOAD_TYPE:
        description: '固件上传方式：release 或 artifact'
        required: false
        type: string
        default: 'release'
      WRT_FIREWALL:
        description: '防火墙版本：fw3 或 fw4'
        required: false
        type: string
        default: 'fw4'

env:
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}
  WRTPackageManager: ${{inputs.WRTPackageManager}}
  UPLOAD_TYPE: ${{inputs.UPLOAD_TYPE}}
  WRT_FIREWALL: ${{inputs.WRT_FIREWALL}}
  DINGDING_TOKEN: ${{ secrets.DINGDING_TOKEN }}

jobs:
  core:
    name: ${{inputs.WRT_CONFIG}}-${{inputs.WRT_FIREWALL}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "START_TIME=$(date +"D%y%m%d_T%H%M%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

          # 缓存相关变量
          WRT_CONFIG_LABEL="${WRT_CONFIG}-${WRT_FIREWALL^^}"
          echo "WRT_CONFIG_LABEL=$WRT_CONFIG_LABEL" >> $GITHUB_ENV

          overlay_hash=$(printf '%s' "$WRT_CONFIG" | sha256sum | cut -c1-12)
          echo "WRT_OVERLAYS_HASH=$overlay_hash" >> $GITHUB_ENV

      - name: Show Build Config (显示编译配置)
        run: |
          echo "=========================================="
          echo "【Lin】编译配置信息"
          echo "=========================================="
          echo "【Lin】配置名称：${WRT_CONFIG}"
          echo "【Lin】设备平台：${WRT_TARGET:-待解析}"
          echo "【Lin】默认主题：${WRT_THEME}"
          echo "【Lin】主机名称：${WRT_NAME}"
          echo "【Lin】默认地址：${WRT_IP}"
          echo "【Lin】默认密码：${WRT_PW:-无}"
          echo "【Lin】WIFI名称：${WRT_SSID}"
          echo "【Lin】WIFI密码：${WRT_WORD}"
          echo "【Lin】包管理器：${WRTPackageManager}"
          echo "【Lin】防火墙版本：${WRT_FIREWALL}"
          echo "【Lin】上传方式：${UPLOAD_TYPE}"
          echo "【Lin】源码来源：${WRT_SOURCE}"
          echo "【Lin】源码分支：${WRT_BRANCH}"
          echo "【Lin】源码仓库：${WRT_REPO}"
          echo "【Lin】仅输出配置：${WRT_TEST:-false}"
          echo "=========================================="

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

          # 缓存相关：提取 DEVICE_SUBTARGET 和 WRT_VER
          WRT_TARGET_FULL=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)
          DEVICE_SUBTARGET="${WRT_TARGET_FULL#*_}"
          echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV

          WRT_REPO_NAME=$(basename "$WRT_REPO" .git)
          echo "WRT_VER=${WRT_REPO_NAME}-${WRT_BRANCH}" >> $GITHUB_ENV

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Restore Toolchain Cache
        id: restore_toolchain_cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache/restore@v5
        with:
          key: toolchain-${{ runner.os }}-${{ env.DEVICE_SUBTARGET }}-${{ env.WRT_VER }}-${{ env.WRT_HASH }}-${{ env.WRT_CONFIG_LABEL }}-${{ env.WRT_OVERLAYS_HASH }}
          restore-keys: |
            toolchain-${{ runner.os }}-${{ env.DEVICE_SUBTARGET }}-${{ env.WRT_VER }}-${{ env.WRT_HASH }}-
            toolchain-${{ runner.os }}-${{ env.DEVICE_SUBTARGET }}-${{ env.WRT_VER }}-${{ env.WRT_HASH }}
          path: |
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Restore ccache Cache
        id: restore_ccache_cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache/restore@v5
        with:
          key: ccache-${{ runner.os }}-${{ env.DEVICE_SUBTARGET }}-${{ env.WRT_VER }}-${{ env.START_TIME }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.DEVICE_SUBTARGET }}-${{ env.WRT_VER }}-
          path: |
            ./wrt/.ccache

      - name: Refresh Cache Metadata
        if: env.WRT_TEST != 'true'
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done

            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build

            echo "【Lin】toolchain skiped done!"
          else
            echo "【Lin】caches missed!"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          # 防火墙版本选择（fw4 为默认，fw3 通过 overlay 覆盖）
          if [ "${WRT_FIREWALL,,}" = "fw3" ]; then
            FW3_OVERLAY="$GITHUB_WORKSPACE/Config/${WRT_CONFIG}-FW3.txt"
            [ -f "$FW3_OVERLAY" ] && cat "$FW3_OVERLAY" >> .config
            echo "【Lin】防火墙版本：fw3"
          else
            echo "【Lin】防火墙版本：fw4"
          fi

          # 保存用户原始配置（make defconfig 之前）
          cp -f ./.config ./my_config.txt

          make defconfig -j$(nproc)

          # 生成 seed.config（记录用户自定义配置与默认配置的差异）
          if [ -f ./scripts/diffconfig.sh ]; then
            bash ./scripts/diffconfig.sh > ./seed.config
          fi

          make clean -j$(nproc)

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Generate Start Notification
        if: always()
        working-directory: ./wrt
        run: |
          chmod +x $GITHUB_WORKSPACE/Scripts/ci_create_start_notification.sh
          bash $GITHUB_WORKSPACE/Scripts/ci_create_start_notification.sh

      - name: Send Start DingTalk Notification
        if: always() && env.DINGDING_TOKEN != ''
        env:
          DINGDING_MESSAGE: |
            ${{ env.start_notify_content }}
        run: |
          payload=$(python3 -c 'import json, os; print(json.dumps({"msgtype":"text","text":{"content": os.environ["DINGDING_MESSAGE"]}}, ensure_ascii=False))')
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "https://oapi.dingtalk.com/robot/send?access_token=${DINGDING_TOKEN}"

      - name: Compile Firmware
        id: compile
        continue-on-error: true
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make -j$(nproc) || make -j1 V=s

      - name: Finalize Status
        if: always()
        run: |
          echo "COMPILE_STATUS=${{ steps.compile.outcome || 'skipped' }}" >> $GITHUB_ENV
          echo "END_TIME=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        if: steps.compile.outcome == 'success' || env.WRT_TEST == 'true'
        working-directory: ./wrt
        run: |
          chmod +x $GITHUB_WORKSPACE/Scripts/ci_organize_outputs.sh
          bash $GITHUB_WORKSPACE/Scripts/ci_organize_outputs.sh

      - name: Generate Release Description
        if: env.UPLOAD_TYPE == 'release' && env.COMPILE_STATUS == 'success'
        working-directory: ./wrt
        run: |
          # 构建固件说明
          SYSTEM_DESC="【${WRT_INFO}】
          固件类型：[常规版]
          支持平台：${WRT_TARGET}
          源码来源：${WRT_SOURCE}
          源码分支：${WRT_BRANCH}
          源码HASH：${WRT_HASH}
          默认地址：${WRT_IP}
          默认密码：${WRT_PW:-无}
          WIFI名称：${WRT_SSID}
          WIFI密码：${WRT_WORD}
          内核版本：${WRT_KVER}"

          # 调用 readme.sh 生成 Release 版本（HTML details 折叠格式）
          bash $GITHUB_WORKSPACE/Scripts/readme.sh \
            -c ./.config \
            -o ./release_desc.txt \
            -s "${SYSTEM_DESC}" \
            -r 'true'

          echo "【Lin】Release 说明已生成"

      - name: Release Firmware
        if: env.UPLOAD_TYPE == 'release' && env.COMPILE_STATUS == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="${WRT_CONFIG}-${WRT_INFO}-${WRT_BRANCH}-${WRT_DATE}"
          release_files=($(find ./wrt/upload/ -type f))

          if [ ${#release_files[@]} -eq 0 ]; then
            echo "【Lin】错误：未找到可上传的固件文件"
            exit 1
          fi

          # 优先使用生成的 Release 说明文件
          if [ -f ./wrt/release_desc.txt ]; then
            gh release create "${release_tag}" "${release_files[@]}" \
              --title "${release_tag}" \
              --notes-file ./wrt/release_desc.txt
          else
            gh release create "${release_tag}" "${release_files[@]}" \
              --title "${release_tag}" \
              --notes "固件发布：${release_tag}"
          fi

          echo "【Lin】Release 已发布：${release_tag}"

      - name: Upload Firmware To Artifact
        if: env.UPLOAD_TYPE == 'artifact' && env.COMPILE_STATUS == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          path: ./wrt/upload

      - name: Cleanup Workspace Before Cache Save
        if: always()
        working-directory: ./wrt
        run: |
          echo "【Lin】为缓存保存释放磁盘空间..."
          rm -rf build_dir bin tmp logs upload
          if [ -d staging_dir ]; then
            find staging_dir -maxdepth 1 -mindepth 1 -type d \( -name 'target-*' -o -name 'packages' -o -name 'pkginfo' \) -exec rm -rf {} +
          fi

      - name: Evaluate Cache Save Inputs
        id: evaluate_cache_save_inputs
        if: always() && env.WRT_TEST != 'true'
        run: |
          toolchain_present=false
          ccache_present=false

          [ -d "./wrt/.ccache" ] && ccache_present=true
          compgen -G "./wrt/staging_dir/host*" > /dev/null && toolchain_present=true
          compgen -G "./wrt/staging_dir/tool*" > /dev/null && toolchain_present=true

          echo "toolchain_present=${toolchain_present}" >> "$GITHUB_OUTPUT"
          echo "ccache_present=${ccache_present}" >> "$GITHUB_OUTPUT"

      - name: Save Toolchain Cache
        if: always() && env.WRT_TEST != 'true' && steps.restore_toolchain_cache.outputs.cache-hit != 'true' && steps.evaluate_cache_save_inputs.outputs.toolchain_present == 'true'
        uses: actions/cache/save@v5
        with:
          key: toolchain-${{ runner.os }}-${{ env.DEVICE_SUBTARGET }}-${{ env.WRT_VER }}-${{ env.WRT_HASH }}-${{ env.WRT_CONFIG_LABEL }}-${{ env.WRT_OVERLAYS_HASH }}
          path: |
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Save ccache Cache
        if: always() && env.WRT_TEST != 'true' && steps.evaluate_cache_save_inputs.outputs.ccache_present == 'true'
        uses: actions/cache/save@v5
        with:
          key: ccache-${{ runner.os }}-${{ env.DEVICE_SUBTARGET }}-${{ env.WRT_VER }}-${{ env.START_TIME }}
          path: |
            ./wrt/.ccache

      - name: Generate Notification
        if: always()
        working-directory: ./wrt
        run: |
          chmod +x $GITHUB_WORKSPACE/Scripts/ci_create_notifications.sh
          bash $GITHUB_WORKSPACE/Scripts/ci_create_notifications.sh

      - name: Send DingTalk Notification
        if: always() && env.DINGDING_TOKEN != ''
        env:
          DINGDING_MESSAGE: |
            ${{ env.notify_content }}
        run: |
          payload=$(python3 -c 'import json, os; print(json.dumps({"msgtype":"text","text":{"content": os.environ["DINGDING_MESSAGE"]}}, ensure_ascii=False))')
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "https://oapi.dingtalk.com/robot/send?access_token=${DINGDING_TOKEN}"
